name: validate

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      run_evals:
        description: "Also run the eval suite (real model runs, costs money)"
        type: boolean
        default: false

jobs:
  structure:
    name: Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Validate plugin structure
        run: python3 scripts/validate_plugin.py

      - name: Validate JSON manifests
        run: |
          python3 -m json.tool .claude-plugin/plugin.json > /dev/null
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null

  evals:
    name: Evals
    if: github.event_name == 'workflow_dispatch' && inputs.run_evals
    runs-on: ubuntu-latest
    needs: structure
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install -g @anthropic-ai/claude-code

      # Every case is a real model run on this credential. Keep the suite small and
      # run it deliberately — before a release, and whenever a skill description changes.
      - name: Run eval suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude plugin eval . \
            --trust-plugin \
            --no-publish \
            --runs 1 \
            --threshold 0.75 \
            --max-cost-usd 8 \
            --report eval-report.html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval-report.html
